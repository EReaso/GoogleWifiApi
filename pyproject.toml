[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "googlewifiapi"
version = "0.1.0"
description = "Asynchronous Python wrapper for the local Google Wifi JSON API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Eddie Reasoner", email = "eddie.reasoner@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.11.0,<3.14.0",
    "mashumaro>=3.22",
    "yarl>=1.24.5",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aioresponses>=0.7.9",
]

[project.urls]
"Homepage" = "https://github.com/EReaso/GoogleWifiApi"
"Bug Tracker" = "https://github.com/EReaso/GoogleWifiApi/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "D",
    "E",
    "F",
    "I",
    "SIM",
    "W",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.13"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
strict = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
